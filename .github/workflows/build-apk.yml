name: Build OliFinancas Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        working-directory: android-app/app
        run: |
          keytool -genkeypair -v \
            -keystore olifinancas-release.jks \
            -alias olifinancas \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass olifinancas2026 \
            -keypass olifinancas2026 \
            -dname "CN=OliFinancas, OU=Finance, O=OliFinancas, L=Rio, S=RJ, C=BR"

      - name: Build Signed Release APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../OliFinancas.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.7.3 >/dev/null 2>&1; then
            gh release upload v1.7.3 OliFinancas.apk --clobber
          else
            gh release create v1.7.3 OliFinancas.apk \
              --title "OliFinanças Android v1.7.3 (Correção Abrir com .OFX em todos os gerenciadores)" \
              --notes "Corrige associação de arquivos .OFX sem MIME type (type == null) e URIs content:// opacos em todos os gerenciadores Android." \
              --latest
          fi
